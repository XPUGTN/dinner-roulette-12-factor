services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dinner
      POSTGRES_PASSWORD: dinner
      POSTGRES_DB: dinner_roulette
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinner -d dinner_roulette"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://dinner:dinner@db:5432/dinner_roulette
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
